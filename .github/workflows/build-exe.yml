name: Build and Package Windows Executable

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 仅拉取代码与子模块，暂时关闭 lfs 自动下载避免 404
      - name: Checkout repository without LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          fetch-depth: 1

      # 2. 清除 Authorization 请求头并从上游拉取 LFS
      - name: Pull LFS objects from upstream
        shell: pwsh
        run: |
          git lfs install
          # 移除 checkout 步骤注入的私有凭据干扰
          git config --unset-all http.https://github.com/.extraheader
          # 添加原作者仓库为 upstream
          git remote add upstream https://github.com/jjonescz/ipasim.git
          # 向上游请求 LFS 数据
          git config lfs.url "https://github.com/jjonescz/ipasim.git/info/lfs"
          git lfs pull upstream


      # 3. 初始化 64位 MSVC 编译环境
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 配置 CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -A x64

      # 5. 编译工程
      - name: Build with CMake
        run: |
          cmake --build build --config Release --parallel

      # 6. 打包收集可执行文件及所需 DLL 运行库
      - name: Package Distributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 收集 Release 输出的可执行文件与 DLL
          Get-ChildItem -Path build -Recurse -Include *.exe, *.dll | Where-Object { $_.FullName -like "*Release*" } | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination dist/ -Force
          }

          Get-ChildItem -Path build/bin -Recurse -Include *.exe, *.dll -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination dist/ -Force
          }

          # 补齐 VC++ 运行库，避免脱机运行缺 dll
          $redistPath = "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT"
          if (Test-Path $redistPath) {
              Copy-Item -Path "$redistPath\*.dll" -Destination dist/ -Force
          }

      # 7. 上传 Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipasim-windows-x64
          path: dist/
          if-no-files-found: error
