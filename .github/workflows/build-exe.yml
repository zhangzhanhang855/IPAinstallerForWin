name: Build and Package Windows Executable

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1. 直接以公共匿名方式完整拉取上游仓库（带所有子模块和 LFS）
      - name: Checkout upstream repository with LFS
        uses: actions/checkout@v4
        with:
          repository: jjonescz/ipasim
          ref: develop
          submodules: recursive
          lfs: true
          persist-credentials: false

      # 2. 检查验证 LFS 文件完整性
      - name: Verify Git LFS objects
        run: git lfs pull

      # 3. 初始化 64位 MSVC 编译环境
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 配置 CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -A x64

      # 5. 编译工程
      - name: Build with CMake
        run: |
          cmake --build build --config Release --parallel

      # 6. 打包收集可执行文件及所需 DLL 运行库
      - name: Package Distributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 收集 Release 输出的可执行文件与 DLL
          Get-ChildItem -Path build -Recurse -Include *.exe, *.dll | Where-Object { $_.FullName -like "*Release*" } | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination dist/ -Force
          }

          Get-ChildItem -Path build/bin -Recurse -Include *.exe, *.dll -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination dist/ -Force
          }

          # 补齐 VC++ 运行库，避免脱机运行缺 dll
          $redistPath = "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT"
          if (Test-Path $redistPath) {
              Copy-Item -Path "$redistPath\*.dll" -Destination dist/ -Force
          }

          # 打印打包目录验证结果
          Get-ChildItem -Path dist

      # 7. 上传 Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipasim-windows-x64
          path: dist/
          if-no-files-found: error
